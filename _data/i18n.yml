  희소뷰·저선량 CT, 내부 단층촬영, k-space 학습을 활용한 가속 MRI, 3차원 영상 분할 등 의료영상 복원·개선·분석을 위한 딥러닝 기술을 연구합니다. 더 안전하고 빠른 촬영으로도 진단에 필요한 영상 품질을 확보하는 것이 목표입니다.: 'We develop deep-learning methods for medical image reconstruction, restoration and analysis — sparse-view / low-dose CT, interior tomography, accelerated MRI via k-space learning, and 3D segmentation — so that safer, faster acquisitions still yield diagnostic-quality images.'
  오디오-텍스트 검색, 텍스트 조건부 영상-음성 합성, 대규모 언어 모델을 활용한 데이터 처리 등 서로 다른 모달리티를 연결하는 모델을 연구합니다. 필요한 형태로 정보를 이해하고 생성하는 시스템을 개발합니다.: 'We study models that move freely between modalities — audio-text retrieval, text-conditioned video-to-speech synthesis, and LLM-based data manipulation — to build systems that understand and produce information in whichever form is most useful.'
  직접음과 잔향의 차이 같은 음향 단서를 활용하고 적대적 공격에도 견디는 위조 음성·영상 탐지 기술을 개발합니다.: 'We build robust detectors for forged speech and video, including approaches that exploit acoustic cues such as direct vs. reverberant waveforms and that stay robust under adversarial attacks.'
  분리된 표현 학습을 통한 연속적인 감정 강도 제어 등 표현력과 제어 가능성을 갖춘 음성 합성 및 음질 개선을 연구합니다.: 'Controllable and expressive speech synthesis — e.g. continuous emotional-intensity control with disentangled representations — and speech enhancement.'
  자연영상의 복원·초해상화와 함께 나노결정의 STEM-EDX 단층촬영, 소수 시점 CT 수하물 검색 등 산업 현장의 영상 문제를 연구합니다.: 'Image restoration and super-resolution for natural images, plus imaging problems from industry such as STEM-EDX tomography for nanocrystals and few-view CT baggage scanners.'
