  Yoseob Han is an Assistant Professor in the Department of Electronic Engineering at Soongsil University, where he leads 4ILab. His research focuses on solving inverse problems in imaging with deep learning — from CT/MRI reconstruction and interior tomography to multimodal generation, retrieval and deepfake detection. He was selected as one of the World’s Top 2% Scientists in 2024.: '한요섭 교수는 숭실대학교 전자정보공학부 조교수로 4ILab을 이끌고 있습니다. CT·MRI 복원과 내부 단층촬영부터 멀티모달 생성·검색, 딥페이크 탐지까지 딥러닝을 활용한 영상 역문제 해결을 연구합니다. 2024년 세계 상위 2% 과학자에 선정되었습니다.'
