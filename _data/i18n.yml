  더 선명하게 보고, 더 깊이 이해하는 AI. 우리는 의료영상, 멀티모달 학습, 딥페이크 탐지를 연구하는 숭실대학교 4ILab입니다.: 'Seeing clearly. Understanding deeply. We are 4ILab at Soongsil University, researching medical imaging, multimodal learning, and deepfake detection.'
  우리가 풀고 있는 문제들: 'The questions we explore'
  영상 속 작은 단서에서, 서로 다른 데이터를 연결하는 새로운 가능성까지.: 'From subtle clues in images to new possibilities across different kinds of data.'
  더 적은 데이터로, 더 선명하게 볼 수 있을까?: 'Can we see more clearly with less data?'
  CT·MRI 영상의 복원과 분석을 통해 더 정확한 의료영상 AI를 연구합니다.: 'We reconstruct and analyze CT and MRI images to develop more accurate medical imaging AI.'
  AI가 보고, 듣고, 읽는 것을 함께 이해한다면?: 'What if AI could understand what it sees, hears, and reads together?'
  텍스트·영상·음성을 연결해 정보를 생성하고 검색하는 방법을 탐구합니다.: 'We connect text, images, and speech to explore new ways of generating and retrieving information.'
  진짜와 만들어진 것의 차이는 어디에 있을까?: 'What separates real media from generated media?'
  합성된 음성과 영상의 흔적을 찾아 딥페이크를 탐지하는 기술을 개발합니다.: 'We develop deepfake detectors that identify traces of synthesized speech and video.'
  영상에 텍스트 정보를 더해, 말소리를 생성하는 방법을 연구합니다.: 'We study how text can guide the generation of speech from video.'
  눈의 움직임을 따라가며, 시선의 방향을 더 잘 이해하는 방법을 탐구합니다.: 'We track eye movements to better understand gaze direction.'
  함께 질문하고,: 'We ask together.'
  함께 성장합니다.: 'We grow together.'
  각자의 호기심을 함께 나누며 연구합니다. 논문을 발표하는 순간도, 연구실에서 보내는 평범한 하루도 4ILab의 이야기입니다.: 'We share our curiosity. From presenting papers to everyday life in the lab, every moment is part of 4ILab.'
  연구를 나누는 자리: 'Sharing our research'
