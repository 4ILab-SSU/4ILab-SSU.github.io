# =============================================================================
# Lab members  ->  rendered on /people/
# -----------------------------------------------------------------------------
# HOW TO ADD YOURSELF (see docs/HOWTO.md):
#   1. Put a square photo (>= 400x400, jpg/png) in assets/img/members/<your-id>.jpg
#   2. Copy a block below into the right group and fill it in.
#   3. Open a pull request. That's it.
#
# Fields
#   name        : full name (English)
#   name_ko     : Korean name (optional)
#   role        : "Ph.D.", "Ph.D. Student", "M.S. Student", "B.S. Student", ...
#   photo       : file name inside assets/img/members/ (omit -> default avatar)
#   email       : (optional)
#   department  : (optional) e.g. "Electronic Engineering (IT)"
#   since       : "YYYY.MM"   when the member joined
#   until       : "YYYY.MM"   only for alumni
#   leader      : true        marks a research-team leader (shows a star)
#   interests   : list of keywords (optional)
#                 Member badges synced from the original Members page, 2026-09-23:
#                 https://sites.google.com/ssu.ac.kr/4ilab/people/members
#   links       : github / scholar / linkedin / homepage (all optional)
#
# Groups are rendered in the order they appear here.
# =============================================================================

