name: "🧑‍🎓 멤버 추가/수정 (Add or update a member)"
description: 신규 멤버 등록, 정보 변경, 졸업(Alumni 이동) 요청
title: "[member] "
labels: [people]
body:
  - type: dropdown
    id: kind
    attributes:
      label: 요청 종류
      options: [신규 멤버 추가, 정보 수정, 졸업 → Alumni 이동]
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: 이름 (영문) / 한글
      placeholder: "Gildong Hong / 홍길동"
    validations:
      required: true
  - type: input
    id: role
    attributes:
      label: 신분 (Role)
      placeholder: "M.S. Student / Ph.D. Student / B.S. Student / Ph.D."
    validations:
      required: true
  - type: input
    id: dept
    attributes:
      label: 소속 (Department)
      placeholder: "Electronic Engineering (IT)"
  - type: input
    id: since
    attributes:
      label: 합류 시기 (YYYY.MM)
  - type: input
    id: email
    attributes:
      label: 이메일
  - type: input
    id: links
    attributes:
      label: GitHub / Google Scholar / LinkedIn 링크
  - type: textarea
    id: interests
    attributes:
      label: 연구 관심사 (쉼표로 구분)
  - type: markdown
    attributes:
      value: "📷 사진은 정사각형(400×400 이상) jpg를 이 이슈에 드래그해서 첨부해 주세요."
